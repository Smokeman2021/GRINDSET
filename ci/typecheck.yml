name: Typecheck

on:
  push:
    branches: [main, grindyk-real-renders]
  pull_request:

jobs:
  tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-mvp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
