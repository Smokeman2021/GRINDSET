# Keep-alive для безкоштовного Supabase: раз на кілька днів робить маленький запит до API,
# щоб проєкт не засинав після тижня без активності. Деталі й ризики: docs/DEPLOY_VERCEL.md (розділ 5).
# Потрібні секрети репозиторію (Settings -> Secrets and variables -> Actions): SUPABASE_URL, SUPABASE_ANON_KEY.
# ВАЖЛИВО: за розкладом GitHub запускає цей файл лише з головної гілки (main).
# Файл лежить у ci/, бо токен, яким працює мій git, не має права створювати файли в .github/workflows.
# Щоб увімкнути: на сайті GitHub створи файл .github/workflows/supabase-keepalive.yml у гілці main й встав цей вміст.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC кожні 3 дні (між запусками не більше ~4 днів)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Секрети SUPABASE_URL / SUPABASE_ANON_KEY не задані, пропускаю (див. docs/DEPLOY_VERCEL.md)"
            exit 0
          fi
          # таблиця keepalive створюється SQL-міграцією (крок 3.2); до того 404 теж означае, що API відповів
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          case "$code" in
            200|206|401|403|404) echo "API відповів, активність зараховано" ;;
            *) echo "::error::Supabase не відповів нормально (HTTP $code): можливо, проєкт заснув. Відкрий панель Supabase і натисни Restore."; exit 1 ;;
          esac
